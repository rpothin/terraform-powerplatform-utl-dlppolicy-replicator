name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Validate
        run: make validate

  docs:
    name: Documentation Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform Docs
        run: |
          TFDOCS_VERSION="v0.21.0"
          TFDOCS_PKG="terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSLo "${TFDOCS_PKG}" "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/${TFDOCS_PKG}"
          curl -sSLo terraform-docs.sha256sum "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}.sha256sum"
          grep "${TFDOCS_PKG}" terraform-docs.sha256sum | sha256sum -c
          tar -xzf "${TFDOCS_PKG}" terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm -f "${TFDOCS_PKG}" terraform-docs.sha256sum

      - name: Generate Docs
        run: |
          terraform-docs .
          for dir in examples/*/; do
            terraform-docs "$dir"
          done

      - name: Check for Changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Documentation is out of date. Run 'terraform-docs' for root and example directories, then commit the changes."
            exit 1
          fi

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          version: "v0.69.3"

  unit:
    name: Unit Tests (Power Platform ${{ matrix.provider-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider-version: ["4.1.0", "4.2.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Pin Power Platform provider for compatibility test
        env:
          POWER_PLATFORM_PROVIDER_VERSION: ${{ matrix.provider-version }}
        run: |
          sed -i "s/version = \"~> 4.0\"/version = \"= ${POWER_PLATFORM_PROVIDER_VERSION}\"/" terraform.tf

      - name: Run Unit Tests
        run: |
          terraform init -backend=false -upgrade -input=false
          terraform test -test-directory=tests/unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: vars.ENABLE_INTEGRATION_TESTS == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run Integration Tests
        run: make test-integration
        env:
          POWER_PLATFORM_USE_OIDC: "true"
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          # The integration test requires the exact display name of a live DLP policy.
          TF_VAR_source_policy_name: ${{ vars.INTEGRATION_SOURCE_POLICY_NAME }}

  performance-benchmark:
    name: DLP Performance Benchmark
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.event.action == 'opened') && vars.ENABLE_INTEGRATION_TESTS == 'true' && vars.ENABLE_INTEGRATION_PERFORMANCE_TESTS == 'true' && vars.INTEGRATION_SOURCE_POLICY_NAME != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Prepare v0.1.3 baseline
        run: |
          git fetch --no-tags origin refs/tags/v0.1.3:refs/tags/v0.1.3
          mkdir -p tests/performance/baseline
          git archive refs/tags/v0.1.3 | tar -x -C tests/performance/baseline

      - name: Initialize baseline and candidate harnesses
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          export TF_PLUGIN_CACHE_DIR="${RUNNER_TEMP}/terraform-plugin-cache"
          terraform -chdir=tests/performance/compare/baseline init -backend=false -input=false
          terraform -chdir=tests/performance/compare/candidate init -backend=false -input=false

      - name: Compare baseline and candidate
        env:
          POWER_PLATFORM_USE_OIDC: "true"
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
          TF_VAR_source_policy_name: ${{ vars.INTEGRATION_SOURCE_POLICY_NAME }}
        run: |
          set -euo pipefail

          run_timed_apply() {
            local label="$1"
            local dir="$2"
            local start_ns end_ns elapsed_ms
            start_ns=$(date +%s%N)
            if ! terraform -chdir="$dir" apply -auto-approve -input=false -no-color > "${RUNNER_TEMP}/${label}.log" 2>&1; then
              local diagnostic
              diagnostic=$(grep -m 1 '^Error:' "${RUNNER_TEMP}/${label}.log" || true)
              echo "::error::${label} Terraform apply failed. ${diagnostic:-Raw policy output is intentionally withheld from workflow logs.}"
              return 1
            fi
            end_ns=$(date +%s%N)
            elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
            echo "${elapsed_ms}"
          }

          echo "::group::Baseline v0.1.3"
          BASELINE_MS=$(run_timed_apply "dlp-baseline" "tests/performance/compare/baseline")
          echo "Baseline apply: ${BASELINE_MS} ms"
          echo "::endgroup::"

          echo "::group::Candidate"
          CANDIDATE_MS=$(run_timed_apply "dlp-candidate" "tests/performance/compare/candidate")
          echo "Candidate apply: ${CANDIDATE_MS} ms"
          echo "::endgroup::"

          terraform -chdir=tests/performance/compare/baseline output -json snapshot > "${RUNNER_TEMP}/dlp-baseline.json"
          terraform -chdir=tests/performance/compare/candidate output -json snapshot > "${RUNNER_TEMP}/dlp-candidate.json"
          # The wrapper removes the "# Generated at:" line; compare all other stable outputs.
          jq -S '.value' "${RUNNER_TEMP}/dlp-baseline.json" > "${RUNNER_TEMP}/dlp-baseline-normalized.json"
          jq -S '.value' "${RUNNER_TEMP}/dlp-candidate.json" > "${RUNNER_TEMP}/dlp-candidate-normalized.json"
          if ! cmp -s "${RUNNER_TEMP}/dlp-baseline-normalized.json" "${RUNNER_TEMP}/dlp-candidate-normalized.json"; then
            echo "::error::Baseline and candidate policy outputs are not semantically identical."
            exit 1
          fi

          BASELINE_POLICY_COUNT=$(terraform -chdir=tests/performance/compare/baseline show -json |
            jq '[.values.root_module | .. | objects | select(.address? == "module.replicator.data.powerplatform_data_loss_prevention_policies.current") | .values.policies[]?] | length')
          CANDIDATE_LIST_COUNT=$(terraform -chdir=tests/performance/compare/candidate state list |
            grep -Fxc 'module.replicator.data.powerplatform_rest_query.policies_list' || true)
          CANDIDATE_DETAIL_COUNT=$(terraform -chdir=tests/performance/compare/candidate state list |
            grep -Fc 'module.replicator.data.powerplatform_rest_query.policy[' || true)
          # The benchmark input is one unique policy, so the targeted path should read one detail.
          BASELINE_POLICY_READS=$(( BASELINE_POLICY_COUNT + 1 ))
          CANDIDATE_POLICY_READS=$(( CANDIDATE_LIST_COUNT + CANDIDATE_DETAIL_COUNT ))
          if [[ "$CANDIDATE_LIST_COUNT" -ne 1 || "$CANDIDATE_DETAIL_COUNT" -ne 1 || "$CANDIDATE_POLICY_READS" -ge "$BASELINE_POLICY_READS" ]]; then
            echo "::error::Unexpected policy-read shape: baseline=${BASELINE_POLICY_READS}, candidate=${CANDIDATE_POLICY_READS}, candidate_list=${CANDIDATE_LIST_COUNT}, candidate_details=${CANDIDATE_DETAIL_COUNT}."
            exit 1
          fi

          echo "Output parity: PASS"
          echo "Policy API reads (derived from provider data-source results): baseline=${BASELINE_POLICY_READS}, candidate=${CANDIDATE_POLICY_READS}"
          {
            echo "## Targeted DLP Read Benchmark"
            echo ""
            echo "| Version | Apply time (ms) |"
            echo "| --- | ---: |"
            echo "| Baseline v0.1.3 | ${BASELINE_MS} |"
            echo "| Candidate | ${CANDIDATE_MS} |"
            echo ""
            echo "Output parity: **PASS**"
            echo ""
            echo "| Policy API reads (provider data-source result shape) | Count |"
            echo "| --- | ---: |"
            echo "| Baseline v0.1.3 | ${BASELINE_POLICY_READS} |"
            echo "| Candidate | ${CANDIDATE_POLICY_READS} |"
            echo ""
            echo "Timings are informational only; no runtime threshold is enforced. This is one baseline/candidate pair in the testing tenant. Repeat only if the result appears anomalous."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove benchmark state and generated policy files
        if: always()
        run: |
          rm -f \
            tests/performance/compare/baseline/terraform.tfstate \
            tests/performance/compare/baseline/terraform.tfstate.backup \
            tests/performance/compare/baseline/benchmark-generated.tfvars \
            tests/performance/compare/candidate/terraform.tfstate \
            tests/performance/compare/candidate/terraform.tfstate.backup \
            tests/performance/compare/candidate/benchmark-generated.tfvars
          rm -f \
            "${RUNNER_TEMP}/dlp-baseline.log" \
            "${RUNNER_TEMP}/dlp-candidate.log" \
            "${RUNNER_TEMP}/dlp-baseline.json" \
            "${RUNNER_TEMP}/dlp-candidate.json" \
            "${RUNNER_TEMP}/dlp-baseline-normalized.json" \
            "${RUNNER_TEMP}/dlp-candidate-normalized.json"
