name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Validate
        run: make validate

  docs:
    name: Documentation Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform Docs
        run: |
          TFDOCS_VERSION="v0.21.0"
          TFDOCS_PKG="terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          curl -sSLo "${TFDOCS_PKG}" "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/${TFDOCS_PKG}"
          curl -sSLo terraform-docs.sha256sum "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}.sha256sum"
          grep "${TFDOCS_PKG}" terraform-docs.sha256sum | sha256sum -c
          tar -xzf "${TFDOCS_PKG}" terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm -f "${TFDOCS_PKG}" terraform-docs.sha256sum

      - name: Generate Docs
        run: |
          terraform-docs .
          for dir in examples/*/; do
            terraform-docs "$dir"
          done

      - name: Check for Changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Documentation is out of date. Run 'terraform-docs' for root and example directories, then commit the changes."
            exit 1
          fi

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          version: "v0.69.3"

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run Unit Tests
        run: make test-unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: vars.ENABLE_INTEGRATION_TESTS == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run Integration Tests
        run: make test-integration
        env:
          POWER_PLATFORM_USE_OIDC: "true"
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          # The integration test requires the exact display name of a live DLP policy.
          TF_VAR_source_policy_name: ${{ vars.INTEGRATION_SOURCE_POLICY_NAME }}

  performance-benchmark:
    name: DLP Performance Benchmark
    runs-on: ubuntu-latest
    if: vars.ENABLE_INTEGRATION_TESTS == 'true' && vars.ENABLE_INTEGRATION_PERFORMANCE_TESTS == 'true' && vars.INTEGRATION_SOURCE_POLICY_NAME != '' && vars.INTEGRATION_SOURCE_POLICY_NAME_B != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend=false
        env:
          POWER_PLATFORM_USE_OIDC: "true"
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}

      - name: Run Performance Benchmarks
        id: benchmark
        run: |
          set -euo pipefail

          POLICY_A="${TF_VAR_source_policy_name_a}"
          POLICY_B="${TF_VAR_source_policy_name_b}"

          # Helper: time a terraform test invocation (nanoseconds → milliseconds).
          # Usage: run_timed <label> <test-directory> [extra TF_VAR env assignments...]
          # terraform test output is forwarded to stderr so it is visible in the
          # GitHub log group; only the RESULT sentinel line goes to stdout for capture.
          run_timed() {
            local label="$1"
            local test_dir="$2"
            shift 2
            # Export any additional env vars passed as "KEY=VALUE" strings
            for kv in "$@"; do
              export "$kv"
            done

            local start_ns end_ns elapsed_ms exit_code=0
            start_ns=$(date +%s%N)
            terraform test -test-directory="$test_dir" >&2 || exit_code=$?
            end_ns=$(date +%s%N)
            elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
            if [[ $exit_code -ne 0 ]]; then
              echo "RESULT label=${label} elapsed_ms=${elapsed_ms} status=FAIL"
              return $exit_code
            fi
            echo "RESULT label=${label} elapsed_ms=${elapsed_ms} status=PASS"
          }

          # --- Scalar A ---
          echo "::group::Scalar benchmark — Policy A"
          SCALAR_A_RESULT=$(run_timed "scalar_A" "tests/performance/scalar" \
            "TF_VAR_source_policy_name=${POLICY_A}")
          echo "$SCALAR_A_RESULT"
          echo "::endgroup::"

          # --- Scalar B ---
          echo "::group::Scalar benchmark — Policy B"
          SCALAR_B_RESULT=$(run_timed "scalar_B" "tests/performance/scalar" \
            "TF_VAR_source_policy_name=${POLICY_B}")
          echo "$SCALAR_B_RESULT"
          echo "::endgroup::"

          # --- Batch A+B ---
          echo "::group::Batch benchmark — Policy A + B"
          BATCH_AB_RESULT=$(run_timed "batch_AB" "tests/performance/batch" \
            "TF_VAR_source_policy_name_a=${POLICY_A}" \
            "TF_VAR_source_policy_name_b=${POLICY_B}")
          echo "$BATCH_AB_RESULT"
          echo "::endgroup::"

          # Parse elapsed times
          SCALAR_A_MS=$(echo "$SCALAR_A_RESULT" | grep -oP '(?<=elapsed_ms=)\d+' || echo "N/A")
          SCALAR_B_MS=$(echo "$SCALAR_B_RESULT" | grep -oP '(?<=elapsed_ms=)\d+' || echo "N/A")
          BATCH_AB_MS=$(echo "$BATCH_AB_RESULT" | grep -oP '(?<=elapsed_ms=)\d+' || echo "N/A")

          # Machine-readable summary to job log
          echo ""
          echo "=== DLP Performance Benchmark Summary ==="
          printf "%-20s %12s %8s\n" "Invocation"        "Wall-clock ms" "Status"
          printf "%-20s %12s %8s\n" "--------------------" "-------------" "--------"
          printf "%-20s %12s %8s\n" "scalar_A"           "$SCALAR_A_MS"  "$(echo "$SCALAR_A_RESULT" | grep -oP '(?<=status=)\S+')"
          printf "%-20s %12s %8s\n" "scalar_B"           "$SCALAR_B_MS"  "$(echo "$SCALAR_B_RESULT" | grep -oP '(?<=status=)\S+')"
          printf "%-20s %12s %8s\n" "batch_AB"           "$BATCH_AB_MS"  "$(echo "$BATCH_AB_RESULT" | grep -oP '(?<=status=)\S+')"
          echo ""
          if [[ "$SCALAR_A_MS" != "N/A" && "$SCALAR_B_MS" != "N/A" ]]; then
            SCALAR_TOTAL=$(( SCALAR_A_MS + SCALAR_B_MS ))
            printf "%-20s %12s\n" "scalar_A + scalar_B" "${SCALAR_TOTAL} ms"
          fi
          printf "%-20s %12s\n" "batch_AB"            "${BATCH_AB_MS} ms"
          echo "========================================="

          # Append to GitHub Step Summary (Markdown table)
          {
            echo "## DLP Performance Benchmark"
            echo ""
            echo "| Invocation | Wall-clock (ms) | Status |"
            echo "| --- | --- | --- |"
            echo "| scalar_A | ${SCALAR_A_MS} | $(echo "$SCALAR_A_RESULT" | grep -oP '(?<=status=)\S+') |"
            echo "| scalar_B | ${SCALAR_B_MS} | $(echo "$SCALAR_B_RESULT" | grep -oP '(?<=status=)\S+') |"
            echo "| batch_AB | ${BATCH_AB_MS} | $(echo "$BATCH_AB_RESULT" | grep -oP '(?<=status=)\S+') |"
            echo ""
            echo "> [!NOTE]"
            echo "> **Interpretation:** wall-clock time measured at the Terraform CLI level."
            echo "> Compare \`scalar_A + scalar_B\` total against \`batch_AB\` measured in the same run"
            echo "> (same runner, tenant, and time window) for a meaningful scalar vs. batch comparison."
            echo "> Do not compare results across different runners, tenants, or times."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          POWER_PLATFORM_USE_OIDC: "true"
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          TF_VAR_source_policy_name_a: ${{ vars.INTEGRATION_SOURCE_POLICY_NAME }}
          TF_VAR_source_policy_name_b: ${{ vars.INTEGRATION_SOURCE_POLICY_NAME_B }}
